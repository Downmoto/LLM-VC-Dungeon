<!DOCTYPE html>
<html>
<head>
  <title>LLM-VC-Dungeon System Flowchart</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      color: #4fc3f7;
      text-align: center;
    }
    #diagram {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px auto;
      max-width: 100%;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>LLM-VC-Dungeon System Communication Flow</h1>
  <div id="diagram"></div>
  <script src="https://unpkg.com/beautiful-mermaid/dist/beautiful-mermaid.browser.global.js"></script>
  <script>
    const { renderMermaid, THEMES } = beautifulMermaid;
    renderMermaid(`
graph TB
    subgraph Frontend["Svelte Frontend :5173"]
        UI[Terminal Component]
        CMD[Command System]
        API[API Client]
        COMP[Page Components]
        LOG[Message Logger]
        
        UI --> CMD
        CMD --> LOG
        COMP --> API
        UI --> API
    end
    
    subgraph Backend["FastAPI Backend :8000"]
        MAIN[Main FastAPI App]
        GAME[Game Engine]
        LLM[LLM Service]
        GEN[Room Generator]
        STORE[Storage Layer]
        
        MAIN --> GAME
        GAME --> LLM
        GAME --> GEN
        GAME --> STORE
        GEN --> LLM
    end
    
    subgraph External["External Services"]
        OLLAMA[Ollama Server :11434]
        CLASSIFY[Classify Model<br/>qwen2.5:3b]
        GENERATE[Generate Model<br/>llama3.2:latest]
        
        OLLAMA --> CLASSIFY
        OLLAMA --> GENERATE
    end
    
    subgraph Persistence["Data Layer"]
        JSON[savegame.json]
        STATE[Game State]
        
        JSON --> STATE
    end
    
    %% frontend to backend communication
    API -->|POST /api/game/turn| MAIN
    API -->|POST /api/new-game| MAIN
    API -->|POST /api/load-game| MAIN
    API -->|GET /| MAIN
    
    %% backend internal flow
    MAIN -->|process_turn| GAME
    GAME -->|classify_intent| LLM
    GAME -->|initial_generation| GEN
    GAME -->|expand_room| GEN
    
    %% llm service to ollama
    LLM -->|ainvoke| OLLAMA
    LLM -->|bind_tools| CLASSIFY
    GEN -->|generate_text| LLM
    
    %% storage operations
    GAME -->|save_game| STORE
    GAME -->|load_game| STORE
    STORE -->|read/write| JSON
    STATE -.->|persisted as| JSON
    
    %% response flow back to frontend
    MAIN -->|GameTurnResponse| API
    API -->|narrative + action| LOG
    LOG --> UI
    
    %% background tasks
    GAME -.->|background_tasks| GEN
    
    classDef frontend fill:#4fc3f7,stroke:#0288d1,color:#000
    classDef backend fill:#66bb6a,stroke:#388e3c,color:#000
    classDef external fill:#ff9800,stroke:#f57c00,color:#000
    classDef storage fill:#ab47bc,stroke:#7b1fa2,color:#fff
    
    class UI,CMD,API,COMP,LOG frontend
    class MAIN,GAME,LLM,GEN,STORE backend
    class OLLAMA,CLASSIFY,GENERATE external
    class JSON,STATE storage
`, THEMES['nord']).then(svg => { 
      document.getElementById('diagram').innerHTML = svg;
    }).catch(err => {
      console.error('Error rendering diagram:', err);
      document.body.innerHTML = '<p>Error: ' + err.message + '</p>';
    });
  </script>
</body>
</html>
